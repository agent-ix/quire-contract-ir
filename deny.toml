[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "Unicode-3.0",
    # Reached through the operation catalog's home: `foldhash` (Zlib) via
    # `hashbrown`, `borrow-or-share` (MIT-0) via `fluent-uri`. Both are permissive
    # and compatible with this crate's AGPL-3.0-or-later.
    "Zlib",
    "MIT-0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

# One copy of every first-party crate is enforced by scripts/check_one_copy.awk
# (run from `make deny`), which reads Cargo.lock.

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/agent-ix/ix-trace-rs",
    "https://github.com/agent-ix/quire-canonical",
    "https://github.com/agent-ix/quire-verification-contracts",
]
