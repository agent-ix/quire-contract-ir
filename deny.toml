[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/agent-ix/filament-core-data",
    "https://github.com/agent-ix/ix-trace-rs",
    "https://github.com/agent-ix/quire-contract-ir",
    "https://github.com/agent-ix/quire-spec-language",
]
