[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Compile-only test marker; AGPL does not enter the published library graph.
    { allow = ["AGPL-3.0-or-later"], crate = "ix-trace-rs" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/agent-ix/ix-trace-rs"]
