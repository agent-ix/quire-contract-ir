name: Rust subset (not release qualification)

on:
  workflow_dispatch:
  pull_request:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Install authoritative string-edge scanner
        run: cargo install --git https://github.com/agent-ix/quire-spec-language.git qsl-string-edge

      - name: Lint
        run: make lint

      - name: Install released Quire lock checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/quire-check-lock"
          gh release download -R agent-ix/quire-cli -p 'quire-*-x86_64-unknown-linux-musl.tar.gz' -D "$RUNNER_TEMP/quire-check-lock"
          tar -xzf "$RUNNER_TEMP"/quire-check-lock/quire-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/quire-check-lock"
          chmod +x "$RUNNER_TEMP/quire-check-lock/quire"

      - name: Install declared minimum Rust toolchain
        run: |
          msrv=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quire-contract-ir") | .rust_version')
          test -n "$msrv" && test "$msrv" != null
          rustup toolchain install "$msrv" --profile minimal

      - name: Test
        env:
          QUIRE_LOCK_CHECKER: ${{ runner.temp }}/quire-check-lock/quire
        run: make test

  supply-chain:
    name: Supply-chain Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Install released Quire lock checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/quire-check-lock"
          gh release download -R agent-ix/quire-cli -p 'quire-*-x86_64-unknown-linux-musl.tar.gz' -D "$RUNNER_TEMP/quire-check-lock"
          tar -xzf "$RUNNER_TEMP"/quire-check-lock/quire-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/quire-check-lock"
          chmod +x "$RUNNER_TEMP/quire-check-lock/quire"
      - name: Check dependency policy and lock coherence
        run: make deny QUIRE="${{ runner.temp }}/quire-check-lock/quire"
      - name: cargo audit
        run: cargo audit
