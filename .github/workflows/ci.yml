name: Rust subset (not release qualification)

on:
  workflow_dispatch:
  pull_request:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Install authoritative string-edge scanner
        run: cargo install --git https://github.com/agent-ix/quire-spec-language.git qsl-string-edge

      - name: Lint
        run: make lint

      - name: Install declared minimum Rust toolchain
        run: |
          msrv=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quire-contract-ir") | .rust_version')
          test -n "$msrv" && test "$msrv" != null
          rustup toolchain install "$msrv" --profile minimal

      - name: Test
        run: make test

  supply-chain:
    name: Supply-chain Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
