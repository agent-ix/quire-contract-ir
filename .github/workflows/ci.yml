# Manual subset only: format, lint, test and supply-chain/unsafe checks.
# Not equivalent to local make release-check: spec, corpus/reproduction, exact
# supported-minimum/qualification checks
# and the complete pinned shared-assurance qualification are not hosted here.
# The test target also needs externally provisioned Quire/Quoin/shared pins;
# this workflow does not presently provision that complete toolchain.
name: Manual Rust subset (not release qualification)

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install declared Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.12"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: make test

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

  supply-chain:
    name: Supply-chain Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny
      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
