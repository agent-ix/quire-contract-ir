[package]
name = "quire-contract-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Cycle-free semantic contract model for the Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_model"
path = "src/lib.rs"

[features]
# Test-only deterministic allocation-failure injection for the output-mapping
# pipeline. Outside the stable surface (FR-019); enabled only by the root
# package's dev-dependency so the integration tests can qualify
# all-or-nothing behaviour.
fault-injection = []

[dependencies]
jsonschema = { version = "=0.17.1", default-features = false }
# The home of `quire.checked-operation-catalog/v1`. This crate reads the catalog
# from there rather than carrying its own copy of the bytes; see
# `checked_package/v2/operation_catalog.rs`.
quire-verification-contracts = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-verification-contracts", rev = "61f4a44d76d51cc53b2dfe7ed10aba7b23cfa6ef" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
# Locates a closed-schema decode failure at the member the decoder reached,
# so a checked-package refusal carries the RFC 6901 pointer of that value.
serde_path_to_error = "=0.1.20"
serde_stacker = "=0.1.11"
sha2 = "=0.10.9"
stacker = "=0.1.15"