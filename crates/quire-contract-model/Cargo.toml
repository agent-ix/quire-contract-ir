[package]
name = "quire-contract-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Cycle-free semantic contract model for the Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_model"
path = "src/lib.rs"

[features]
# Test-only deterministic allocation-failure injection for the output-mapping
# pipeline. Outside the stable surface (FR-019); enabled only by the root
# package's dev-dependency so the integration tests can qualify
# all-or-nothing behaviour.
fault-injection = []

[dependencies]
jsonschema = { version = "=0.17.1", default-features = false }
# The home of `quire.checked-operation-catalog/v1`. This crate reads the catalog
# from there rather than carrying its own copy of the bytes; see
# `checked_package/v2/operation_catalog.rs`.
quire-verification-contracts = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-verification-contracts", branch = "main" }
# The one RFC 8785 encoder every identity digest and the V2 wire types encode
# through, and the reader's canonical-bytes check; see
# `checked_package/v2/encode.rs`. The `serde_json` feature is its `Encode` for
# `serde_json::Value` and the non-recursive `drop_value`.
quire-canonical = { version = "=0.3.0", git = "https://github.com/agent-ix/quire-canonical", branch = "main", features = ["serde_json"] }
serde = { version = "=1.0.228", features = ["derive"] }
# `float_roundtrip` makes the package document's parse of a shortest round-trip
# text exact, so the canonical-bytes comparison of the value read holds
# whatever other crates in the build turn on (FR-038-AC-111).
serde_json = { version = "=1.0.151", features = ["unbounded_depth", "float_roundtrip"] }
# Locates a closed-schema decode failure at the member the decoder reached,
# so a checked-package refusal carries the RFC 6901 pointer of that value.
serde_path_to_error = "=0.1.20"
# The v1 modules (FR-019, FR-023) keep `serde_stacker` and `stacker`; the V2
# reader (`checked_package/`) uses neither.
serde_stacker = "=0.1.11"
sha2 = "=0.10.9"
stacker = "=0.1.15"
# The shared iterative walk (`Walk` and `walk`): every walk of the V2 reader
# over a term runs on its explicit heap stack, never on the call stack.
quire-walk = { git = "https://github.com/agent-ix/quire-walk", branch = "main" }
# The Rust identifier syntax of an abstraction relation body (FR-346): the
# Unicode identifier tables and the NFC check FR-450's "Rust spellings" name.
unicode-ident = "=1.0.24"
unicode-normalization = "=0.1.25"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }