[workspace]
members = [".", "crates/quire-contract-model"]
resolver = "2"

[package]
name = "quire-contract-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_ir"
path = "src/lib.rs"

[dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model" }
quire-observation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-observation", rev = "2bdeb833a330bfa777c19eb4c28c423f856f3ba6" }
quire-protocol = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-protocol", rev = "9606131bbc978c494e81df13a8301a5d8a72017a" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "2736b62b2f741496590d099d71478b3044d638d6", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
serde_stacker = "=0.1.11"
sha2 = "=0.10.9"
stacker = "=0.1.15"
thiserror = "=2.0.20"
tl-syntax = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-syntax", rev = "d52d89549b0a6c0c429261bab912cd5396c4a19e", features = ["serde"] }
tl-mltl = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-mltl", rev = "a79c0db844f0e9266a49f72636f241e8004e3465" }

[dev-dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model", features = ["fault-injection"] }
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
jsonschema = { version = "=0.17.1", default-features = false }
quire-contract-model-owner = { package = "quire-contract-model", version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "53cc03c639e2e26528132d34d96dc56449df78e8" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "2736b62b2f741496590d099d71478b3044d638d6", default-features = false }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
