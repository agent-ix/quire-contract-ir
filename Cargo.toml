[workspace]
members = [".", "crates/quire-contract-model"]
resolver = "2"

[package]
name = "quire-contract-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_ir"
path = "src/lib.rs"

[dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model" }
quire-observation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-observation", rev = "2bdeb833a330bfa777c19eb4c28c423f856f3ba6" }
quire-protocol = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-protocol", rev = "02684bff9dd46e0d57f2792d831f4e81b0888493" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "51245876e0d406aeed3047c608ad478b53b19205", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
serde_stacker = "=0.1.11"
sha2 = "=0.10.9"
stacker = "=0.1.15"
thiserror = "=2.0.20"
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax", rev = "4a5614193d21e5ae99950ae683b04ba0ec931358", features = ["serde"] }
tl-mltl = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-mltl", rev = "452f013a3168512603d427bce3360bc14c1175a6" }
# The one deliberate exception to tl-mltl's independence from the agent-ix/Quire
# ecosystem: quire-mltl ports tl-mltl's wire::request/report and
# mapping::contract_ir modules onto quire-observation's owner-assertion views
# (TL-178/TL-175). tl-mltl stays a direct dependency too for the wire::trace,
# past::*, and OwnerLimits/OwnerReadError/ValidatedTrace types quire-mltl does
# not re-export. Both crates must resolve one tl-mltl (quire-mltl takes
# tl-mltl's OwnerLimits/ValidatedTrace), so quire-mltl is pinned to the rev
# that moves it onto tl-mltl v0.3.0 (agent-ix/quire-mltl#5); its v0.1.0 tag
# still pins the pre-0.3 tl-mltl.
quire-mltl = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-mltl", rev = "06bd57fd1a3f4920029ce171f1e95211e0816086" }

[dev-dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model", features = ["fault-injection"] }
agent-ix-baseline-producer = { version = "=0.0.0", git = "https://github.com/agent-ix/filament-core-data", rev = "a6fe662542770e6acbec4917cfe1772b349ee414" }
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
jsonschema = { version = "=0.17.1", default-features = false }
quire-contract-model-owner = { package = "quire-contract-model", version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "dc03aa4ecfbce9958efe6d766497d44c44e1200a" }
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", rev = "51245876e0d406aeed3047c608ad478b53b19205" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "51245876e0d406aeed3047c608ad478b53b19205", default-features = false }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
