[workspace]
members = [".", "crates/quire-contract-model"]
resolver = "2"

[package]
name = "quire-contract-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_ir"
path = "src/lib.rs"

# FR-038-AC-107: reads QSpec's positive fixtures from a `quire-specification`
# checkout, which `make test` has not got, so this target is outside the run of
# `cargo test --workspace --all-targets` (`test = false`) and is run by
# `make conformance-qspec` alone, which names it.
[[test]]
name = "conformance_qspec"
path = "tests/conformance_qspec/main.rs"
test = false

# FR-038-AC-214: 177 MB fixture and three isolated reader processes.
# Explicitly invoked for the memory gate, excluded from ordinary `make test`.
[[test]]
name = "ir575_reader_memory"
path = "tests/ir575_reader_memory.rs"
test = false

[dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
thiserror = "=2.0.20"

[dev-dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model", features = ["fault-injection"] }
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
quire-canonical = { version = "=0.3.0", git = "https://github.com/agent-ix/quire-canonical", branch = "main" }
quire-verification-contracts = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-verification-contracts", branch = "main" }
jsonschema = { version = "=0.17.1", default-features = false }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
