[workspace]
members = [".", "crates/quire-contract-model"]
resolver = "2"

[package]
name = "quire-contract-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_ir"
path = "src/lib.rs"

[dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "9395be4268e650ca2753204d6d306c9cd7b453ec", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
thiserror = "=2.0.20"

[dev-dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model", features = ["fault-injection"] }
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
jsonschema = { version = "=0.17.1", default-features = false }
quire-contract-model-owner = { package = "quire-contract-model", version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "7b1ec7a19f031dcea433293a25af57f0bb6a14f8" }
qsl-foundation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "9395be4268e650ca2753204d6d306c9cd7b453ec" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "9395be4268e650ca2753204d6d306c9cd7b453ec", default-features = false, features = ["handoff-writer"] }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
