[package]
name = "quire-contract-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_ir"
path = "src/lib.rs"

[dependencies]
jsonschema = { version = "=0.17.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
serde_stacker = "=0.1.11"
sha2 = "=0.10.9"
stacker = "=0.1.15"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }

[profile.release]
lto = "thin"
codegen-units = 1
