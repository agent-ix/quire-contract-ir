[workspace]
members = [".", "crates/quire-contract-model"]
resolver = "2"

[package]
name = "quire-contract-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/quire-contract-ir"

[lib]
name = "quire_contract_ir"
path = "src/lib.rs"

[dependencies]
quire-contract-model = { version = "=0.1.0", path = "crates/quire-contract-model" }
quire-observation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-observation", rev = "9ac80e93f4b68a2c7d5a337f9a448ad10de798fc" }
quire-protocol = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-protocol", rev = "34d1752e6c5f789a52ccf115b0694eedd96cdd46" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "f1700a9264d6d3bcdd07e0f77b70f3dae9ed4c07", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
serde_stacker = "=0.1.11"
sha2 = "=0.10.9"
stacker = "=0.1.15"
thiserror = "=2.0.20"
tl-syntax = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-syntax", rev = "842d82553f045eb69a7f38745756d968254fc25e", features = ["serde"] }
tl-mltl = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-mltl", rev = "22862189ac4eb515ab84928faec25b2eac47d835" }

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
jsonschema = { version = "=0.17.1", default-features = false }
quire-contract-model-owner = { package = "quire-contract-model", version = "=0.1.0", git = "https://github.com/agent-ix/quire-contract-ir", rev = "53cc03c639e2e26528132d34d96dc56449df78e8" }
quire-spec-language = { version = "=0.2.0", git = "https://github.com/agent-ix/quire-spec-language", rev = "f1700a9264d6d3bcdd07e0f77b70f3dae9ed4c07", default-features = false }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
