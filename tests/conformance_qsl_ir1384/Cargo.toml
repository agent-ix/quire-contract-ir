[package]
name = "ir1384-qsl-receipt"
version = "0.0.0"
edition = "2021"
publish = false
description = "FR-361 explicit lane: a genuine QSL tick-monitor plan and its admitted authority bind through IR's selected closure."

# A standalone package: the cycle-free model crate takes no QSL dependency, and
# the ordinary workspace gate never builds this lane. Run `make conformance-qsl-ir1384`.
[workspace]

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
quire-contract-model = { path = "../../crates/quire-contract-model" }
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main" }
quire-observation = { git = "https://github.com/agent-ix/quire-observation", branch = "main" }
serde_json = "1"
qsl-analyze = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }

# The producer and the consumer must share this checkout's model crate.
[patch."https://github.com/agent-ix/quire-contract-ir"]
quire-contract-model = { path = "../../crates/quire-contract-model" }

[[test]]
name = "receipt"
path = "tests/receipt.rs"
